[pytest]
testpaths = api-tests fhir-tests integration-tests security-tests claims-tests audit-tests
addopts = -v --tb=short
asyncio_mode = auto
markers =
    smoke: Smoke tests - critical path
    regression: Regression test suite
    negative: Negative/error path tests
    fhir: FHIR compliance tests
    integration: Integration/E2E tests
    performance: Performance tests
    security: Security and authorization tests
    claims: Claims and insurance coverage tests
    audit: Audit, metrics, and observability tests


